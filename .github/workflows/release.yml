name: Publish tested prerelease
on:
  workflow_dispatch:
    inputs:
      version:
        description: '与当前VERSION一致的内测版本，例如0.1.0-alpha.0'
        required: true
        type: string
      candidate_run_id:
        description: '同一提交的成功Windows verification运行ID，须已有candidate-win-x64产物'
        required: true
        type: string
      evidence_json:
        description: '验收执行者提供的同包JSON证据，契约见详细设计12.4'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: prerelease-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/verify.py
      - name: Check candidate provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^[0-9]+$') { throw '运行ID无效' }
          if ($env:RELEASE_VERSION -ne (Get-Content -Raw VERSION).Trim()) { throw 'VERSION不一致' }
          $result = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN"
          if ($LASTEXITCODE -ne 0) { throw '无法核对候选运行' }
          $run = $result | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne $env:EXPECTED_COMMIT -or
              $run.path -ne '.github/workflows/verify.yml' -or
              $run.event -notin @('push', 'workflow_dispatch')) { throw '候选来源、结果或提交不匹配' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: candidate-win-x64
          path: tmp/candidate
      - name: Validate exact package and evidence
        shell: pwsh
        env:
          EVIDENCE_JSON: ${{ inputs.evidence_json }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python -c "import os,pathlib; pathlib.Path('tmp/evidence.json').write_text(os.environ['EVIDENCE_JSON'], encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw '无法读取验收证据' }
          python scripts/release_gate.py --candidate tmp/candidate --evidence tmp/evidence.json --version $env:RELEASE_VERSION --commit $env:EXPECTED_COMMIT
          if ($LASTEXITCODE -ne 0) { throw '发布门未通过' }
          Copy-Item -LiteralPath tmp/evidence.json -Destination tmp/candidate/verification-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gated-prerelease
          path: tmp/candidate/
          if-no-files-found: error
  publish:
    needs: gate
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gated-prerelease
          path: candidate
      - name: Publish unchanged package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          $package = "candidate/EmbeddedHelper-$env:RELEASE_VERSION-win-x64.zip"
          gh release create "v$env:RELEASE_VERSION" candidate/EmbeddedHelper.exe $package candidate/release-manifest.json candidate/SHA256SUMS candidate/verification-evidence.json --repo $env:GITHUB_REPOSITORY --target $env:EXPECTED_COMMIT --title "Embedded Helper $env:RELEASE_VERSION" --notes-file candidate/release-notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release发布失败；不得报告成功' }
