name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository checks (no product build)
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      client_ready: ${{ steps.inventory.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/verify.py --install-hooks
      - run: python scripts/verify.py
      - id: inventory
        shell: pwsh
        run: |
          $ready = Test-Path -LiteralPath EmbeddedHelper.slnx
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready) {
            "客户端未验证：尚无C#工程。本次只通过仓库检查，不产出客户端包。" >> $env:GITHUB_STEP_SUMMARY
          }
  client:
    name: C# checks (requires client source)
    needs: repository
    if: needs.repository.outputs.client_ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: python scripts/package_client.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: client-test-results
          path: test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-win-x64
          path: dist/candidate/
          if-no-files-found: error
