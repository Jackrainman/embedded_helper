name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository checks (no product build)
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      client_ready: ${{ steps.inventory.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/verify.py --install-hooks
      - run: python scripts/version_guard.py --check
      - run: python scripts/verify.py
      - id: inventory
        shell: pwsh
        run: |
          $ready = Test-Path -LiteralPath EmbeddedHelper.slnx
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready) {
            "客户端未验证：尚无C#工程。本次只通过仓库检查，不产出客户端包。" >> $env:GITHUB_STEP_SUMMARY
          }
  client:
    name: C# checks (requires client source)
    needs: repository
    if: needs.repository.outputs.client_ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: python scripts/package_client.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: client-test-results
          path: test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-win-x64
          path: dist/candidate/
          if-no-files-found: error
