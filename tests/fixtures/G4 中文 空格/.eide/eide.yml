version: "4.1"
name: g4_template
type: ARM
deviceName: STM32G474VETx
packDir: .pack/Keil/STM32G4xx_DFP.1.6.0
srcDirs:
  - CubeMX/Core/Src
  - CubeMX/Drivers/STM32G4xx_HAL_Driver/Src
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Bsp
      files:
        - path: User/Bsp/core_delay/core_delay.c
        - path: User/Bsp/bsp.c
        - path: User/Bsp/syscalls/syscalls.c
        - path: User/Bsp/can_list/can_list.c
        - path: User/Bsp/DJI-Motor/dji_bldc_motor.c
        - path: User/Bsp/usart_ex/usart_ex.c
      folders: []
    - name: Application
      files:
        - path: User/Application/Src/rtos_tasks.c
      folders: []
    - name: Middlewares
      files: []
      folders:
        - name: FreeRTOS
          files: []
          folders:
            - name: Core
              files:
                - path: User/Middlewares/FreeRTOS/croutine.c
                - path: User/Middlewares/FreeRTOS/event_groups.c
                - path: User/Middlewares/FreeRTOS/list.c
                - path: User/Middlewares/FreeRTOS/queue.c
                - path: User/Middlewares/FreeRTOS/stream_buffer.c
                - path: User/Middlewares/FreeRTOS/tasks.c
                - path: User/Middlewares/FreeRTOS/timers.c
              folders: []
            - name: Portable
              files:
                - path: User/Middlewares/FreeRTOS/portable/MemMang/heap_4.c
                - path: User/Middlewares/FreeRTOS/portable/GCC/ARM_CM4F/port.c
              folders: []
    - name: Utils
      files:
        - path: User/Utils/ring_fifo/ring_fifo.c
        - path: User/Utils/logger/logger.c
      folders: []
    - name: CMSIS
      files: []
      folders:
        - name: startup
          files:
            - path: CubeMX/Drivers/CMSIS/Device/ST/STM32G4xx/Source/gcc/startup_stm32g474xx.S
          folders: []
dependenceList: []
outDir: Build
miscInfo:
  uid: fixture-anonymous
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - DEBUG
        - STM32G474xx
      incList:
        - .
        - User/Bsp
        - User/Application/Inc
        - User/Utils
        - User/Middlewares/FreeRTOS/include
        - User/Middlewares/FreeRTOS/portable/GCC/ARM_CM4F
        - CubeMX/Core/Inc
        - CubeMX/Drivers/STM32G4xx_HAL_Driver/Inc
        - CubeMX/Drivers/CMSIS/Include
        - CubeMX/Drivers/CMSIS/Device/ST/STM32G4xx/Include
      libList: []
    excludeList:
      - <virtual_root>/Drivers/CSP/CAN_STM32G4xx.c
      - <virtual_root>/Drivers/CSP/I2C_STM32G4xx.c
      - <virtual_root>/Drivers/CSP/SPI_STM32G4xx.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_adc_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_adc.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_crc_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_cryp_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_cryp.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_dac_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_dac.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_dma_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_exti.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_hrtim.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_iwdg.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_qspi.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_rtc_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_rtc.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_sram.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_tim_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_tim.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_usart_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_usart.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_wwdg.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_ll_fmc.c
      - <virtual_root>/Drivers/CSP/RTC_STM32G4xx.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_spi_ex.c
      - <virtual_root>/Drivers/HAL_Driver/stm32g4xx_hal_spi.c
      - CubeMX/Core/Src/Backup
      - CubeMX/Core/Src/syscalls.c
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
            misc-controls: --diag_suppress=1950
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: -Wno-padded -Wno-unsafe-buffer-usage -Wno-reserved-identifier -Wno-missing-noreturn -Wno-covered-switch-default -Wno-switch-enum -Wno-missing-prototypes -Wno-newline-eof -Wno-gnu-pointer-arith -Wno-declaration-after-statement -Wno-sign-conversion -Wno-implicit-int-conversion -Wno-double-promotion -Wno-missing-field-initializers -Wno-self-assign -Wno-extra-semi-stmt -Wno-missing-variable-declarations -Wno-cast-align -Wno-implicit-float-conversion -Wno-missing-braces -Wno-cast-qual -Wno-format-nonliteral -Wno-gnu-binary-literal
            C_FLAGS: -Wno-padded -Wno-unsafe-buffer-usage -Wno-reserved-identifier -Wno-missing-noreturn -Wno-covered-switch-default -Wno-switch-enum -Wno-missing-prototypes -Wno-newline-eof -Wno-gnu-pointer-arith -Wno-declaration-after-statement -Wno-sign-conversion -Wno-implicit-int-conversion -Wno-double-promotion -Wno-missing-field-initializers -Wno-self-assign -Wno-extra-semi-stmt -Wno-missing-variable-declarations -Wno-cast-align -Wno-implicit-float-conversion -Wno-missing-braces -Wno-cast-qual -Wno-format-nonliteral -Wno-gnu-binary-literal -Wno-invalid-utf8
            language-c: c11
            language-cpp: c++11
            link-time-optimization: true
            one-elf-section-per-function: true
            optimization: level-0
            short-enums#wchar: true
            warnings: all-warnings
          global:
            output-debug-info: enable
          linker:
            misc-controls: --diag_suppress=L6329
            output-format: elf
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x00020000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x00080000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: .\CubeMX\Drivers\CMSIS\Device\ST\STM32G4xx\Source\ld\STM32G474XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32G474VE
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink

# Unknown extension must survive edits
x-fixture: preserve-me
