version: "4.1"
name: h7-template
type: ARM
deviceName: STM32H743IITx
packDir: .pack/Keil/STM32H7xx_DFP.3.3.1
srcDirs:
  - CubeMX/Core/Src
  - CubeMX/Drivers/STM32H7xx_HAL_Driver/Src
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Bsp
      files:
        - path: User/Bsp/core_delay/core_delay.c
        - path: User/Bsp/bsp.c
        - path: User/Bsp/syscalls/syscalls.c
        - path: User/Bsp/can_list/can_list.c
        - path: User/Bsp/DJI-Motor/dji_bldc_motor.c
        - path: User/Bsp/usart_ex/usart_ex.c
        - path: User/Bsp/core_mpu/core_mpu.c
      folders: []
    - name: Application
      files:
        - path: User/Application/Src/rtos_tasks.c
      folders: []
    - name: Middlewares
      files: []
      folders:
        - name: FreeRTOS
          files: []
          folders:
            - name: Core
              files:
                - path: User/Middlewares/FreeRTOS/croutine.c
                - path: User/Middlewares/FreeRTOS/event_groups.c
                - path: User/Middlewares/FreeRTOS/list.c
                - path: User/Middlewares/FreeRTOS/queue.c
                - path: User/Middlewares/FreeRTOS/stream_buffer.c
                - path: User/Middlewares/FreeRTOS/tasks.c
                - path: User/Middlewares/FreeRTOS/timers.c
              folders: []
            - name: Portable
              files:
                - path: User/Middlewares/FreeRTOS/portable/MemMang/heap_4.c
                - path: User/Middlewares/FreeRTOS/portable/GCC/ARM_CM7/r0p1/port.c
              folders: []
    - name: Utils
      files:
        - path: User/Utils/ring_fifo/ring_fifo.c
      folders: []
    - name: CMSIS
      files: []
      folders:
        - name: startup
          files:
            - path: CubeMX/Drivers/CMSIS/Device/ST/STM32H7xx/Source/gcc/startup_stm32h743xx.s
          folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: aee7563576d9659d7dd1f279a8c8a403
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - DEBUG
        - STM32H743xx
      incList:
        - .
        - User/Bsp
        - User/Application/Inc
        - User/Utils
        - User/Middlewares/FreeRTOS/include
        - User/Middlewares/FreeRTOS/portable/GCC/ARM_CM7/r0p1
        - CubeMX/Core/Inc
        - CubeMX/Drivers/STM32H7xx_HAL_Driver/Inc
        - CubeMX/Drivers/CMSIS/Include
        - CubeMX/Drivers/CMSIS/Device/ST/STM32H7xx/Include
      libList: []
    excludeList:
      - CubeMX/Core/Src/Backup
      - CubeMX/Core/Src/syscalls.c
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
            misc-controls: --diag_suppress=1950
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: -Wno-padded -Wno-unsafe-buffer-usage -Wno-reserved-identifier -Wno-missing-noreturn -Wno-covered-switch-default -Wno-switch-enum -Wno-missing-prototypes -Wno-newline-eof -Wno-gnu-pointer-arith -Wno-declaration-after-statement -Wno-sign-conversion -Wno-implicit-int-conversion -Wno-double-promotion -Wno-missing-field-initializers -Wno-self-assign -Wno-extra-semi-stmt -Wno-missing-variable-declarations -Wno-cast-align -Wno-implicit-float-conversion -Wno-missing-braces -Wno-cast-qual -Wno-format-nonliteral -Wno-gnu-binary-literal
            C_FLAGS: -Wno-padded -Wno-unsafe-buffer-usage -Wno-reserved-identifier -Wno-missing-noreturn -Wno-covered-switch-default -Wno-switch-enum -Wno-missing-prototypes -Wno-newline-eof -Wno-gnu-pointer-arith -Wno-declaration-after-statement -Wno-sign-conversion -Wno-implicit-int-conversion -Wno-double-promotion -Wno-missing-field-initializers -Wno-self-assign -Wno-extra-semi-stmt -Wno-missing-variable-declarations -Wno-cast-align -Wno-implicit-float-conversion -Wno-missing-braces -Wno-cast-qual -Wno-format-nonliteral -Wno-gnu-binary-literal
            language-c: c11
            language-cpp: c++11
            link-time-optimization: true
            one-elf-section-per-function: true
            optimization: level-0
            short-enums#wchar: true
            warnings: all-warnings
          global:
            output-debug-info: enable
          linker:
            misc-controls: --diag_suppress=L6329
            output-format: elf
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x00020000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: true
              mem:
                size: "0x00080000"
                startAddr: "0x24000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x00100000"
                startAddr: "0x08000000"
              tag: IROM
            - id: 2
              isChecked: true
              isStartup: false
              mem:
                size: "0x00100000"
                startAddr: "0x08100000"
              tag: IROM
        useCustomScatterFile: false
      GCC:
        archExtensions: ""
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: .\CubeMX\Drivers\CMSIS\Device\ST\STM32H7xx\Source\ld\STM32H743XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32H743II
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
